spring.application.name=flashing
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:flashing}}
spring.datasource.username=${DB_USERNAME:flashing}
spring.datasource.password=${DB_PASSWORD:flashing_local}
spring.jpa.hibernate.ddl-auto=update
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}
app.jwt.refresh-token-days=${JWT_REFRESH_TOKEN_DAYS:7}
