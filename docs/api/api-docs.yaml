openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/v1/challenges:
    get:
      tags:
      - challenge-rest-controller
      operationId: findAll
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChallengeDTO"
components:
  schemas:
    ChallengeDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        prompt:
          type: string
        type:
          type: string
          enum:
          - DOUBLE_PHOTO
          - QUICK_DRAWING
          - SHORT_AUDIO
          - GUIDED_PHOTO
          - SHORT_TEXT
        durationSeconds:
          type: integer
          format: int32
