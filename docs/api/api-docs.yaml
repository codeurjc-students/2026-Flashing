openapi: 3.1.0
info:
  title: Flashing API
  description: API REST de la aplicación Flashing.
  version: 0.0.1
servers:
  - url: http://localhost:8080
    description: Servidor local de desarrollo
tags:
  - name: Retos
    description: Consulta de las plantillas de retos disponibles.
paths:
  /api/v1/challenges:
    get:
      tags:
        - Retos
      summary: Obtener todos los retos
      description: Devuelve las plantillas de retos ordenadas por identificador ascendente.
      operationId: findAllChallenges
      responses:
        "200":
          description: Lista de retos recuperada correctamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChallengeDTO"
components:
  schemas:
    ChallengeDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Identificador único del reto.
          example: 1
        title:
          type: string
          description: Título breve del reto.
          example: Doble perspectiva
        prompt:
          type: string
          description: Instrucción que debe completar el usuario.
          example: Fotografía lo que tienes delante y detrás.
        type:
          type: string
          description: Formato de respuesta requerido.
          enum:
          - DOUBLE_PHOTO
          - QUICK_DRAWING
          - SHORT_AUDIO
          - GUIDED_PHOTO
          - SHORT_TEXT
        durationSeconds:
          type: integer
          format: int32
          description: Tiempo disponible para completar el reto, en segundos.
          example: 120
